<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>购物清单</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #8a919c;
      --accent: #16a34a;
      --danger: #dc2626;
      --border: #e5e8ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    #empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 0;
    }
    #empty-state .emoji { font-size: 40px; display: block; margin-bottom: 8px; }
    #item-list { list-style: none; margin: 0; padding: 0; }
    #add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    #add-form input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
    }
    #name-input { flex: 1; min-width: 0; }
    #quantity-input { width: 72px; }
    #add-button {
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      padding: 10px 16px;
      cursor: pointer;
    }
    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    .item-row:last-child { border-bottom: none; }
    .purchased-toggle { width: 18px; height: 18px; accent-color: var(--accent); }
    .item-label { flex: 1; }
    .item-row.purchased .item-label {
      text-decoration: line-through;
      color: var(--muted);
    }
    .delete-button {
      border: none;
      background: none;
      color: var(--danger);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 6px;
    }
    #form-error {
      color: var(--danger);
      font-size: 14px;
      margin: -8px 0 12px;
    }
    @media (max-width: 480px) {
      .container { padding: 16px 12px; }
      #add-form { flex-wrap: wrap; }
      #name-input { flex: 1 1 100%; }
      #quantity-input { flex: 1; width: auto; }
      #add-button { flex: 2; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 购物清单</h1>
    <form id="add-form">
      <input id="name-input" type="text" placeholder="要买什么？" autocomplete="off" />
      <input id="quantity-input" type="number" value="1" min="1" max="99" aria-label="数量" />
      <button id="add-button" type="submit">添加</button>
    </form>
    <p id="form-error" role="alert" hidden></p>
    <div class="card">
      <ul id="item-list"></ul>
      <div id="empty-state" hidden>
        <span class="emoji">🧺</span>
        清单是空的，添加第一项吧
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
